name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks on ${{ matrix.os }} (Node 24)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm pack --dry-run

  integration:
    name: Real Dart SDK and Lumine integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LUMINE_JASMINE_REPORTER: list
      LUMINE_TEST_PACKAGES: ide language-dart
      DART_VERSION: 3.13.5
      REQUIRE_DART_LSP: 1
      REQUIRE_DART_MANAGED_INSTALL: 1
    steps:
      - uses: actions/checkout@v7
        with:
          path: ide-dart
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/lumine
          path: lumine
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/ide
          path: ide
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/language-dart
          path: language-dart
      - uses: actions/setup-node@v7
        with:
          node-version-file: lumine/.nvmrc
          cache: npm
          cache-dependency-path: lumine/package-lock.json
      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: 3.13.5
      - name: Export exact native Dart executable
        run: |
          echo "DART_PATH=$(command -v dart)" >> "$GITHUB_ENV"
          dart --version
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Use HTTPS for public Git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install adapter dependencies
        working-directory: ide-dart
        run: npm ci --ignore-scripts
      - name: Install client dependencies
        working-directory: ide
        run: npm ci --ignore-scripts
      - name: Install editor dependencies
        working-directory: lumine
        run: |
          install() { npm ci --ignore-scripts; }
          install || install || install
      - name: Prepare Electron
        working-directory: lumine
        run: |
          node node_modules/electron/install.js
          npm run build
      - name: Provision isolated service dependencies
        run: |
          echo "LUMINE_HOME=$GITHUB_WORKSPACE/.test-home" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.test-home/packages"
          ln -s "$GITHUB_WORKSPACE/ide" "$GITHUB_WORKSPACE/.test-home/packages/ide"
          ln -s "$GITHUB_WORKSPACE/language-dart" "$GITHUB_WORKSPACE/.test-home/packages/language-dart"
      - name: Run Jasmine specs against the real editor and SDK
        working-directory: lumine
        timeout-minutes: 25
        run: xvfb-run --auto-servernum npm start -- --test ../ide-dart/spec
